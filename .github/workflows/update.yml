name: update-and-deploy

# 하루 두 번(KST 04:30, 16:30) 요금제·행사 정보를 수집해 사이트를 다시 만들고 배포한다.
# 코드를 푸시했을 때는 수집을 건너뛰고(저장소의 최근 데이터 사용) 빌드·배포만 하므로 몇 분 안에 끝난다.
on:
  schedule:
    - cron: "30 19 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 단계는 하나가 실패해도 이전 데이터를 유지한 채 다음 단계로 진행한다. (푸시 실행에서는 건너뜀)
      - name: 알뜰폰 요금제·제휴카드 수집
        if: github.event_name != 'push'
        run: python collect/run_all.py
        continue-on-error: true

      - name: 편의점·마트 행사 수집
        if: github.event_name != 'push'
        run: python collect/deal/run_deals.py
        continue-on-error: true

      - name: 쿠팡 파트너스 링크 변환 (키가 없으면 건너뜀)
        if: github.event_name != 'push'
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python collect/deal/coupang_links.py
        continue-on-error: true

      - name: 쿠팡 자급제폰 TOP 10 (키가 없으면 건너뜀)
        if: github.event_name != 'push'
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python collect/deal/coupang_phones.py
        continue-on-error: true

      - name: 사이트 빌드
        run: python build.py

      # 데이터 저장이 실패해도(예: 그 사이 다른 푸시가 있었을 때) 배포는 계속한다. 충돌하면 최신 수집 데이터를 우선해 재시도.
      - name: 수집 데이터 저장
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name "wooafamily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
