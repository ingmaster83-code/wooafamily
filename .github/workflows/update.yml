name: update-and-deploy

# 하루 두 번(KST 04:30, 16:30) 요금제·행사 정보를 수집해 사이트를 다시 만들고 배포한다.
on:
  schedule:
    - cron: "30 19 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 단계는 하나가 실패해도 이전 데이터를 유지한 채 다음 단계로 진행한다.
      - name: 알뜰폰 요금제·제휴카드 수집
        run: python collect/run_all.py
        continue-on-error: true

      - name: 편의점·마트 행사 수집
        run: python collect/deal/run_deals.py
        continue-on-error: true

      - name: 쿠팡 파트너스 링크 변환 (키가 없으면 건너뜀)
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python collect/deal/coupang_links.py
        continue-on-error: true

      - name: 사이트 빌드
        run: python build.py

      - name: 수집 데이터 저장
        run: |
          git config user.name "wooafamily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
